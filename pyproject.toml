[project]
name = "obsidian-vault-mcp"
version = "0.1.0"
description = "MCP server for semantic search over an Obsidian vault"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    # Bounded above, for the same reason ruff is pinned in CI below.
    #
    # The filter passed to table.delete() is SQL, and LanceDB changed how it
    # parses one: 0.37.1 accepted a double-quoted string where 0.38.0 reads the
    # same token as a column identifier. Under `>=0.6` that was a live landmine
    # -- rebuilding the server's venv on 2026-09-01 moved it from 0.37.1 to
    # 0.38.0 and froze the index until the quoting was fixed, with no code
    # change and nothing in the diff to point at.
    #
    # The ceiling is the part doing the work: bump it deliberately, and re-run
    # tests/test_delete_filter.py, which exercises the dialect against a real
    # table rather than assuming it. The floor spans both known-good versions on
    # purpose -- the current quoting is verified against 0.37.1 and 0.38.0, and
    # the work laptop resolves through an internal mirror that stops at 0.37.1,
    # so a tighter floor would make the project uninstallable there.
    "lancedb>=0.37.1,<0.39",
    "openai>=1.0",
    "ollama>=0.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "hypothesis",
]

[project.scripts]
vault-mcp = "src.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults.
#
# This repo had no ruff config, so CI enforced whatever ruff's default select
# happened to be. Ruff 0.16 widened that default, and because the CI action
# installs ruff unpinned, a commit that passed in July started failing with 18
# errors in untouched files. Verified by running several ruff versions against
# the same tree: 0.11 / 0.13 / 0.15 all pass, 0.16.1 reports 18.
#
# These four are the historical default set, so this restores the rule set that
# was actually being enforced -- now stated outright, so a future ruff release
# cannot move the goalposts again.
select = ["E4", "E7", "E9", "F"]

# Deliberately NOT enabled yet. Ruff 0.16 flags these across indexer.py,
# search.py, embeddings.py and chunker.py; adopting them is a real code change,
# not a config change, so it belongs in its own commit:
#   BLE001  blind `except Exception` (9 sites) -- narrowing these alters
#           behaviour in the indexer, so each needs judging on its own
#   DTZ006  naive datetime.fromtimestamp() on file mtimes
#   C401    two generators that could be set comprehensions
#   I001    unsorted import blocks (mechanical, auto-fixable)
